  <main class="contenido">
    <h1 class="titulo">Pongamonos en contacto</h1>
    <p class="texto">Hablame, para colaborar o para hablar o para preguntarme dudas o para enviarme fotos de cachorros de Golden Retriever.</p>

    <form class="formulario" action="#" method="post">
      <label class="formulario-etiqueta" for="nombre">Nombre</label>
      <input class="formulario-campo" type="text" id="nombre" name="nombre">

      <label class="formulario-etiqueta" for="correo">Correo</label>
      <input class="formulario-campo" type="email" id="correo" name="correo">

      <label class="formulario-etiqueta" for="mensaje">Motivo</label>
      <textarea class="formulario-campo" id="mensaje" name="mensaje" rows="5"></textarea>

      <button class="formulario-boton" type="submit">Contactar</button>
    </form>
  </main>
